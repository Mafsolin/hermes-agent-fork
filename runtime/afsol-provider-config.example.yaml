# Safe provider overlay for the Afsol profile.
#
# Merge the top-level keys below into /home/afsol/.hermes/config.yaml after
# making a backup. The API keys are intentionally environment references;
# real values belong only in /home/afsol/.hermes/.env and must never enter Git.
#
# Models are an explicit, last-verified allowlist. discover_models is disabled
# so an upstream/provider catalog refresh cannot silently change routing.

browser:
  # Explicitly select the anti-detection Firefox/Camoufox backend.
  # The Camofox server address is supplied by CAMOFOX_URL in .env.
  cloud_provider: "camofox"
  camofox:
    managed_persistence: true

stt:
  enabled: true
  provider: "groq"
  groq:
    model: "whisper-large-v3-turbo"

auxiliary:
  vision:
    provider: "custom"
    model: "google/gemini-3.1-flash-lite"
    base_url: "https://routerai.ru/api/v1"
    api_key: "${ROUTER_HERMES_API_KEY}"
    timeout: 120
    download_timeout: 30

web:
  # The built-in Hermes web_search tool uses the separate Mafsolin Search MCP
  # router; this is not the same as the LLM provider named Mafsolin below.
  # The MCP server reads MAFSOLIN_SEARCH_API_KEY from the profile .env.
  search_backend: "mcp"

custom_providers:
  - name: "Router Hermes"
    base_url: "https://routerai.ru/api/v1"
    api_mode: "chat_completions"
    api_key: "${ROUTER_HERMES_API_KEY}"
    model: "google/gemini-3.1-flash-lite"
    discover_models: false
    models:
      google/gemini-3.1-flash-lite:
        name: "google/gemini-3.1-flash-lite"
        context_length: 262000
      deepseek/deepseek-v4-flash:
        name: "deepseek/deepseek-v4-flash"
        context_length: 262000
      poolside/laguna-xs-2.1:
        name: "poolside/laguna-xs-2.1"
        context_length: 262000

  - name: "ModelHub"
    base_url: "https://modelhub.my/v1"
    api_mode: "chat_completions"
    api_key: "${MODELHUB_API_KEY}"
    model: "claude-sonnet-5"
    discover_models: false
    models:
      claude-opus-4-8:
        name: "claude-opus-4-8"
        context_length: 400000
      claude-sonnet-5:
        name: "claude-sonnet-5"
        context_length: 400000
      deepseek-v4-new:
        name: "deepseek-v4-new"
        context_length: 400000
      glm-5.2:
        name: "glm-5.2"
        context_length: 400000
      gpt-5.4-mini:
        name: "gpt-5.4-mini"
        context_length: 400000
      gpt-5.5:
        name: "gpt-5.5"
        context_length: 400000
      gpt-5.6-luna:
        name: "gpt-5.6-luna"
        context_length: 256000
      gpt-5.6-sol:
        name: "gpt-5.6-sol"
        context_length: 256000
      gpt-5.6-terra:
        name: "gpt-5.6-terra"
        context_length: 256000
      kimi-k3:
        name: "kimi-k3"
        context_length: 400000

  - name: "Mafsolin"
    base_url: "https://api.mafsolin.space/v1"
    api_mode: "chat_completions"
    api_key: "${MAFSOLIN_SEARCH_API_KEY}"
    model: "antigravity/gemini-3.6-flash-high"
    discover_models: false
    models:
      antigravity/gemini-3.1-flash-lite:
        name: "antigravity/gemini-3.1-flash-lite"
        context_length: 1048576
        max_output_tokens: 65535
        no_image_support: false
      antigravity/gemini-3.6-flash-high:
        name: "antigravity/gemini-3.6-flash-high"
        context_length: 1048576
        max_output_tokens: 65536
        no_image_support: false
      codex/gpt-5.6-luna:
        name: "codex/gpt-5.6-luna"
        context_length: 272000
        max_output_tokens: 128000
        no_image_support: true
        reasoning_effort: "medium"
      codex/gpt-5.6-sol:
        name: "codex/gpt-5.6-sol"
        context_length: 272000
        max_output_tokens: 128000
        no_image_support: true
        reasoning_effort: "medium"
      codex/gpt-5.6-terra:
        name: "codex/gpt-5.6-terra"
        context_length: 272000
        max_output_tokens: 128000
        no_image_support: true
        reasoning_effort: "medium"
      oc/deepseek-v4-flash-free:
        name: "oc/deepseek-v4-flash-free"
        context_length: 1000000
        max_output_tokens: 384000
        no_image_support: true
        reasoning_effort: "medium"
      opencode-go/deepseek-v4-flash:
        name: "opencode-go/deepseek-v4-flash"
        context_length: 1000000
        max_output_tokens: 128000
        no_image_support: true
        reasoning_effort: "medium"
      opencode-go/deepseek-v4-pro:
        name: "opencode-go/deepseek-v4-pro"
        context_length: 1000000
        max_output_tokens: 128000
        no_image_support: true
        reasoning_effort: "medium"
      opencode-go/gpt-5.6-luna:
        name: "opencode-go/gpt-5.6-luna"
        context_length: 272000
        max_output_tokens: 128000
        no_image_support: true
        reasoning_effort: "medium"

model:
  provider: "custom:mafsolin"
  default: "opencode-go/deepseek-v4-flash"
